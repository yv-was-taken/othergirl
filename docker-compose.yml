services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: othergirl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/othergirl
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-to-a-real-secret-for-production-use-only
      CHAT_KEY_ENCRYPTION_KEY_B64: ${CHAT_KEY_ENCRYPTION_KEY_B64:-}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
